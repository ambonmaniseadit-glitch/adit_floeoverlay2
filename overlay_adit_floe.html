<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adit_floe Gravity TikTok LIVE Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.stage{position:relative;width:100vw;height:100vh;background:transparent}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
/* Covers the ticker lettering baked into the PNG while preserving the neon ticker frame. */
.ticker-window{position:absolute;left:16%;top:76.5%;width:68%;height:5.2%;overflow:hidden;display:flex;align-items:center;background:rgba(2,4,20,.98);}
.ticker{white-space:nowrap;display:inline-block;padding-left:100%;font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:clamp(12px,1.35vw,25px);color:#fff;text-shadow:0 0 6px #00eaff,0 0 10px #8b4dff;animation:scroll 20s linear infinite}
.ticker .pink{color:#ff35c8}.ticker .cyan{color:#00f0ff}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker{animation-duration:45s}}
</style>
</head>
<body>
<div class="stage">
  <img class="frame" src="overlay_adit_floe.png" alt="Overlay TikTok LIVE adit_floe tema Gravity">
  <div class="ticker-window" aria-label="Teks berjalan">
    <div class="ticker">🚀 <span class="pink">adit_floe</span> • Jangan lupa Follow ya! • <span class="cyan">Request lagu : !play judul lagu</span> • 🚀</div>
  </div>
</div>
</body>
</html>
